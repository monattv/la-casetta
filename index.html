<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Redirect...</title>
<script>
const ua = navigator.userAgent;

if (/android/i.test(ua)) {
    window.location.replace("https://play.google.com/store/apps/details?id=com.goodbarber.terrasini");
} else if (/iphone|ipad|ipod/i.test(ua)) {
    window.location.replace("https://apps.apple.com/it/app/terrasini/id993594848");
} else {
    window.location.replace("https://play.google.com/store/apps/details?id=com.goodbarber.terrasini");
}
</script>
</head>
<body>
<p>Reindirizzamento in corso...</p>
</body>
</html>
