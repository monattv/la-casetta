<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>La Casetta Terrasini</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background-size:cover;
    background-position:center;
    transition:background-image 1s ease;
}

.overlay{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.45);
}

.card{
    position:relative;
    z-index:2;
    width:90%;
    max-width:450px;
    background:rgba(255,255,255,0.92);
    padding:35px;
    border-radius:25px;
    text-align:center;
    box-shadow:0 10px 35px rgba(0,0,0,0.35);
}

h1{
    color:#003580;
    font-size:32px;
    margin-bottom:15px;
}

p{
    color:#444;
    line-height:1.5;
    margin-bottom:25px;
}

.button{
    display:block;
    padding:17px;
    margin:15px 0;
    border-radius:15px;
    text-decoration:none;
    font-size:20px;
    font-weight:bold;
}

.booking{
    background:#003580;
    color:white;
}

.app{
    background:#28a745;
    color:white;
}

.footer{
    margin-top:20px;
    font-size:13px;
    color:#666;
}

</style>


<script>

let images=[
"IMG_2108.jpeg",
"IMG_2110.jpeg",
"IMG_2111.jpeg"
];

let index=0;

function changeBackground(){

document.body.style.backgroundImage =
"url('" + images[index] + "')";

index++;

if(index>=images.length){
index=0;
}

}

setInterval(changeBackground,5000);
window.onload=changeBackground;


function openApp(){

let ua=navigator.userAgent.toLowerCase();

if(ua.includes("android")){

window.location.href=
"https://play.google.com/store/apps/details?id=com.goodbarber.terrasini";

}

else if(
ua.includes("iphone") ||
ua.includes("ipad")
){

window.location.href=
"https://apps.apple.com/it/app/terrasini/id993594848";

}

else{

window.location.href=
"https://play.google.com/store/apps/details?id=com.goodbarber.terrasini";

}

}

</script>

</head>


<body>

<div class="overlay"></div>


<div class="card">

<h1>La Casetta Terrasini</h1>

<p>
Welcome to your Sicilian getaway.<br>
Discover our apartment, book your stay and explore everything Terrasini has to offer.
</p>


<a class="button booking"
href="https://www.booking.com/hotel/it/la-casetta-terrasini.it.html">
🏡 Book Your Stay
</a>


<a class="button app"
href="#" onclick="openApp()">
📱 Terrasini App
</a>


<div class="footer">
Enjoy your stay in Sicily 🇮🇹
</div>


</div>

</body>
</html>
