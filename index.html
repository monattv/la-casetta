<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Benvenuto</title>

<style>
body{
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    background:#f5f5f5;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.container{
    text-align:center;
    background:white;
    padding:40px;
    border-radius:20px;
    box-shadow:0 5px 20px rgba(0,0,0,.15);
    width:90%;
    max-width:400px;
}

h1{
    color:#333;
    margin-bottom:30px;
}

button{
    width:100%;
    padding:18px;
    margin:12px 0;
    font-size:20px;
    border:none;
    border-radius:12px;
    cursor:pointer;
    transition:.2s;
}

button:hover{
    transform:scale(1.03);
}

.booking{
    background:#003580;
    color:white;
}

.app{
    background:#34a853;
    color:white;
}
</style>

<script>
function apriBooking(){
    window.location.href="https://www.booking.com/hotel/it/la-casetta-terrasini.it.html";
}

function apriApp(){
    const ua=navigator.userAgent.toLowerCase();

    if(ua.includes("android")){
        window.location.href="https://play.google.com/store/apps/details?id=com.goodbarber.terrasini";
    }else if(ua.includes("iphone") || ua.includes("ipad") || ua.includes("ipod")){
        window.location.href="https://apps.apple.com/it/app/terrasini/id993594848";
    }else{
        window.location.href="https://play.google.com/store/apps/details?id=com.goodbarber.terrasini";
    }
}
</script>

</head>

<body>

<div class="container">
<h1>Benvenuto 👋</h1>

<button class="booking" onclick="apriBooking()">
🏠 Casetta Booking
</button>

<button class="app" onclick="apriApp()">
📱 App Terrasini
</button>

</div>

</body>
</html>
