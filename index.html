<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>La Casetta Terrasini</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,Helvetica,sans-serif;
}

body{
height:100vh;
background:url("background.jpg") center center/cover no-repeat;
display:flex;
justify-content:center;
align-items:center;
}

.overlay{
position:fixed;
inset:0;
background:rgba(0,0,0,.45);
}

.card{
position:relative;
z-index:1;
width:90%;
max-width:480px;
background:rgba(255,255,255,.92);
backdrop-filter:blur(10px);
border-radius:22px;
padding:35px;
text-align:center;
box-shadow:0 15px 35px rgba(0,0,0,.3);
}

h1{
font-size:34px;
margin-bottom:10px;
color:#003580;
}

p{
color:#555;
line-height:1.6;
margin-bottom:30px;
}

a{
display:block;
text-decoration:none;
padding:18px;
margin:15px 0;
border-radius:14px;
font-size:20px;
font-weight:bold;
transition:.25s;
}

.booking{
background:#003580;
color:white;
}

.booking:hover{
background:#0047aa;
}

.app{
background:#1aa34a;
color:white;
}

.app:hover{
background:#14853b;
}

.footer{
margin-top:20px;
font-size:13px;
color:#777;
}
</style>

<script>
function openApp(){
const ua=navigator.userAgent.toLowerCase();

if(ua.includes("android")){
location.href="https://play.google.com/store/apps/details?id=com.goodbarber.terrasini";
}else if(ua.includes("iphone")||ua.includes("ipad")){
location.href="https://apps.apple.com/it/app/terrasini/id993594848";
}else{
location.href="https://play.google.com/store/apps/details?id=com.goodbarber.terrasini";
}
}
</script>

</head>

<body>

<div class="overlay"></div>

<div class="card">

<h1>La Casetta Terrasini</h1>

<p>
Experience the charm of Sicily in the heart of Terrasini.
Plan your stay, discover local attractions and enjoy everything the town has to offer.
</p>

<a class="booking" href="https://www.booking.com/hotel/it/la-casetta-terrasini.it.html">
🏡 Book Your Stay
</a>

<a class="app" href="#" onclick="openApp()">
📱 Discover Terrasini App
</a>

<div class="footer">
We hope you enjoy your stay in Terrasini 🇮🇹
</div>

</div>

</body>
</html>
